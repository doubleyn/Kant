function advance(state,course){const last=course.slides[state.slide].frames.length-1;return state.step<last?{...state,step:state.step+1}:state.slide<course.slides.length-1?{slide:state.slide+1,step:0}:state;}
function previous(state,course){return state.slide>0?{slide:state.slide-1,step:course.slides[state.slide-1].frames.length-1}:state;}
function parseRoute(hash,courses){const m=hash.match(/^#\/day\/(\d{4}-\d\d-\d\d)(?:\/(\d+))?(?:\/(\d+))?$/);if(!m)return null;const course=courses.find(c=>c.id===m[1]);if(!course)return null;const slide=Math.max(0,Math.min(course.slides.length-1,(+m[2]||1)-1));const step=Math.max(0,Math.min(course.slides[slide].frames.length-1,+m[3]||0));return{course,slide,step};}

function home(){document.title='Kant';$('#app').innerHTML=`<header class="home-header"><a class="brand" href="#/">kant<span>.</span></a><span>LEARNING NOTES</span></header><main class="chooser"><p class="eyebrow">무엇을 볼까요?</p><h1>하나를 선택하세요<span>.</span></h1><div class="choice-grid"><a class="choice" href="#/til"><span class="choice-icon">📒</span><span class="choice-label">TIL</span><strong>오늘 배운 것들</strong><p>날짜별 실습 기록을 한 장면씩 따라가기</p><small>${lectures.length}개 기록</small><span class="choice-arrow">→</span></a><a class="choice jobs" href="fastapi-jobs/index.html"><span class="choice-icon">💼</span><span class="choice-label">JOBS</span><strong>FastAPI 채용공고</strong><p>서울·경기 공고를 경력과 기술 기준으로 탐색</p><small>151건</small><span class="choice-arrow">→</span></a></div></main>`;}
function draw(animate=true){const next=parseRoute(location.hash,lectures);if(!next){route=null;location.hash==='#/til'?til():home();return;}route=next;const {course,slide:idx,step}=route;const s=course.slides[idx],f=s.frames[step];document.title=`${course.date} · ${s.title} · Kant`;const changedScene=lastScene!==course.id+'/'+idx;lastScene=course.id+'/'+idx;const oldText=new Map([...document.querySelectorAll('[data-key]')].map(el=>[el.dataset.key,el.textContent]));const rects=new Map([...document.querySelectorAll('[data-key]')].map(el=>[el.dataset.key,el.getBoundingClientRect()]));$('#app').innerHTML=`<header class="viewer-header"><a href="#/" class="brand">kant<span>.</span></a><button id="toc-button" class="course-name">${course.date} <span>${escape(course.title)}　⌄</span></button><div class="header-actions">${s.notes.length?'<button id="notes-button" aria-expanded="'+notesOpen+'">노트 '+s.notes.length+'</button>':''}<button id="fullscreen" aria-label="전체 화면">⛶</button></div></header><main class="viewer ${s.notes.length&&notesOpen?'has-notes':''}"><section class="stage" aria-label="슬라이드, 왼쪽은 이전 장, 오른쪽은 다음 단계"><div class="slide-heading"><p class="eyebrow">${escape(s.section)}</p><h1>${escape(s.title)}</h1></div><div class="scene">${s.scene==='concept'?`<div class="concept-scene">${(f.items||[]).map((t,i)=>`<div data-key="item-${i}" class="concept-item"><span>${String(i+1).padStart(2,'0')}</span><p>${escape(t)}</p></div>`).join('')}</div>`:editor(f,s)}</div><div class="caption" aria-live="polite"><span class="caption-dot"></span>${escape(f.caption)}</div><div class="example-label">${s.scene==='concept'?'노션 원문 기반':'교육용 UI 시뮬레이션 · 출력·경로·해시는 예시'}</div></section>${s.notes.length?`<aside class="notes ${notesOpen?'open':''}" aria-label="보충 노트"><div class="notes-title">SIDE NOTES <button id="close-notes" aria-label="노트 닫기">×</button></div>${s.notes.map(n=>`<article class="note"><span class="note-kind">${n.kind}</span><p>${escape(n.text)}</p>${n.answer?`<details><summary>해설 보기</summary><p>${escape(n.answer)}</p></details>`:''}${n.link?`<a href="${escape(n.link)}" target="_blank" rel="noopener">참고 자료 ↗</a>`:''}</article>`).join('')}<a class="source" href="${s.source}" target="_blank" rel="noopener">노션 원문 · ${escape(s.section)} ↗</a></aside>`:''}</main><footer class="controls"><button id="prev" aria-label="이전 슬라이드" ${idx===0?'disabled':''}>←</button><span class="slide-count">${String(idx+1).padStart(2,'0')} <small>/ ${course.slides.length}</small></span><div class="steps" aria-label="단계 ${step+1}/${s.frames.length}">${s.frames.map((_,i)=>`<i class="${i<=step?'done':''}"></i>`).join('')}</div><span class="step-count">${step+1} / ${s.frames.length} 단계</span><button id="next" aria-label="다음 단계" ${idx===course.slides.length-1&&step===s.frames.length-1?'disabled':''}>${step<s.frames.length-1?'다음 단계':'다음 장'} →</button></footer><dialog id="toc"><div class="toc-head"><b>날짜별 강의 / 목차</b><button id="close-toc" aria-label="목차 닫기">×</button></div>${lectures.map(l=>`<details ${l.id===course.id?'open':''}><summary>${l.date} · ${escape(l.title)}</summary>${l.slides.map((x,i)=>`<a href="#/day/${l.id}/${i+1}/0">${i+1}. ${escape(x.title)}</a>`).join('')}</details>`).join('')}</dialog>`;
$('#next').onclick=()=>move(1);$('#prev').onclick=()=>move(-1);$('#fullscreen').onclick=fullscreen;$('#toc-button').onclick=()=>$('#toc').showModal();$('#close-toc').onclick=()=>$('#toc').close();$('#toc').onclick=e=>{if(e.target===$('#toc'))$('#toc').close()};if($('#notes-button'))$('#notes-button').onclick=toggleNotes;if($('#close-notes'))$('#close-notes').onclick=toggleNotes;
const stage=$('.stage');stage.onclick=e=>{if(Date.now()<suppressClick||e.target.closest('a,button,input,details,summary')||getSelection()?.toString())return;move(e.clientX-stage.getBoundingClientRect().left<stage.clientWidth/3?-1:1);};stage.ontouchstart=e=>{touch={x:e.touches[0].clientX,y:e.touches[0].clientY}};stage.ontouchend=e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){suppressClick=Date.now()+600;move(dx<0?1:-1)}};
animations=[];if(animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const mapped=new Set();document.querySelectorAll('[data-key]').forEach(el=>{const old=rects.get(el.dataset.key);if(old){mapped.add(el);const now=el.getBoundingClientRect();if(now.width&&now.height&&(Math.abs(old.left-now.left)>1||Math.abs(old.top-now.top)>1||Math.abs(old.width-now.width)>1||Math.abs(old.height-now.height)>1)){animations.push(el.animate([{transformOrigin:'top left',transform:`translate(${old.left-now.left}px,${old.top-now.top}px) scale(${old.width/now.width},${old.height/now.height})`},{transformOrigin:'top left',transform:'none'}],{duration:650,easing:'cubic-bezier(.4,0,.2,1)'}));}if(oldText.get(el.dataset.key)!==el.textContent&&['code','terminal-output','notebook','graph'].includes(el.dataset.key)){animations.push(el.animate([{opacity:.25,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:450}));}}else if(!el.parentElement.closest('[data-key]')||el.dataset.key.startsWith('cell-'))animations.push(el.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:450}));});animations.push($('.caption').animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:450}));if(changedScene)animations.push(stage.animate([{opacity:0},{opacity:1}],{duration:300}));}
}
function finish(){if(animations.some(a=>a.playState==='running')){animations.forEach(a=>a.finish());return true}return false;}
function move(dir){if(!route||finish())return;const state={slide:route.slide,step:route.step},n=dir>0?advance(state,route.course):previous(state,route.course);if(n.slide===state.slide&&n.step===state.step)return;location.hash=`/day/${route.course.id}/${n.slide+1}/${n.step}`;}
function toggleNotes(){animations.forEach(a=>a.finish());notesOpen=!notesOpen;draw(false);}
async function fullscreen(){try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch{}}
addEventListener('hashchange',draw);addEventListener('keydown',e=>{if(!route||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select,summary')||$('#toc')?.open)return;if(e.target.closest('button,a')&&['Enter',' '].includes(e.key))return;if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();move(1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();move(-1)}else if(e.key.toLowerCase()==='n'){e.preventDefault();if(route.course.slides[route.slide].notes.length)toggleNotes()}else if(e.key.toLowerCase()==='f')fullscreen();else if(e.key==='Home')location.hash=`/day/${route.course.id}/1/0`;else if(e.key==='End')location.hash=`/day/${route.course.id}/${route.course.slides.length}/0`;});draw();
</script></body></html>
